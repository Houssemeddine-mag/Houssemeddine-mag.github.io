
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="HoussemOS 2.0 — Interactive portfolio of Houssem Eddine Magra, Software Engineer and Master 2 Data Science & Intelligent Systems student. 19 projects across AI, mobile, web and distributed systems.">
    <meta name="theme-color" content="#eaf2fc">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234e8ed3'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='36' font-weight='700' fill='%23fff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

    <title>HoussemOS 2.0 — Houssem Eddine Magra</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/windows.css">
    <link rel="stylesheet" href="css/taskbar.css">

    <script src="js/main.js" defer></script>
    <script src="js/applications.js" defer></script>
</head>

<body>

<!-- SVG ICON LIBRARY -->
<svg xmlns="http://www.w3.org/2000/svg"
     class="icon-library"
     aria-hidden="true">

    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </symbol>

    <symbol id="icon-folder" viewBox="0 0 24 24">
        <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </symbol>

    <symbol id="icon-code" viewBox="0 0 24 24">
        <path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>
    </symbol>

    <symbol id="icon-briefcase" viewBox="0 0 24 24">
        <rect x="3" y="7" width="18" height="14" rx="2"/>
        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/>
    </symbol>

    <symbol id="icon-graduation" viewBox="0 0 24 24">
        <path d="m2 10 10-5 10 5-10 5z"/>
        <path d="M6 12v5c4 3 8 3 12 0v-5M22 10v6"/>
    </symbol>

    <symbol id="icon-terminal" viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="18" rx="3"/>
        <path d="m7 9 3 3-3 3M13 15h4"/>
    </symbol>

    <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
    </symbol>

    <symbol id="icon-wifi" viewBox="0 0 24 24">
        <path d="M5 9a11 11 0 0 1 14 0M8 12a7 7 0 0 1 8 0M11 15a3 3 0 0 1 2 0M12 19h.01"/>
    </symbol>

    <symbol id="icon-volume" viewBox="0 0 24 24">
        <path d="M11 5 6 9H3v6h3l5 4z"/>
        <path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/>
    </symbol>

    <symbol id="icon-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
    </symbol>

    <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M16 3v4M8 3v4M3 10h18"/>
    </symbol>

    <symbol id="icon-monitor" viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="15" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
    </symbol>

    <symbol id="icon-power" viewBox="0 0 24 24">
        <path d="M12 2v10M6 5a9 9 0 1 0 12 0"/>
    </symbol>

    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15 21 16.5l-2 3-2-.7a8 8 0 0 1-2 1L14.5 22h-5L9 19.8a8 8 0 0 1-2-1l-2 .7-2-3L4.6 15a8 8 0 0 1 0-2L3 11.5l2-3 2 .7a8 8 0 0 1 2-1L9.5 6h5l.5 2.2a8 8 0 0 1 2 1l2-.7 2 3-1.6 1.5a8 8 0 0 1 0 2z"/>
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path d="m16 16 5 5"/>
    </symbol>

    <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6"/>
    </symbol>

    <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
    </symbol>

    <symbol id="icon-rocket" viewBox="0 0 24 24">
        <path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8-.8-.8-2-.8-3-.2z"/>
        <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </symbol>

    <symbol id="icon-medal" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="6"/>
        <path d="M8.5 13.5L7 22l5-3 5 3-1.5-8.5"/>
    </symbol>

    <symbol id="icon-phone" viewBox="0 0 24 24">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/>
    </symbol>

    <symbol id="icon-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </symbol>

    <symbol id="icon-github" viewBox="0 0 24 24">
        <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>
    </symbol>

    <symbol id="icon-linkedin" viewBox="0 0 24 24">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4V8h4v1.5A6 6 0 0 1 16 8z"/>
        <rect x="2" y="9" width="4" height="12"/>
        <circle cx="4" cy="4" r="2"/>
    </symbol>

</svg>

<main id="operating-system">

    <!-- DESKTOP -->
    <section id="desktop">

        <!-- ANIMATED WALLPAPER -->
        <div class="wallpaper">

            <canvas id="wallpaper-canvas"></canvas>

            <div class="aurora aurora-one"></div>
            <div class="aurora aurora-two"></div>
            <div class="aurora aurora-three"></div>

            <div class="wallpaper-overlay"></div>

        </div>

        <!-- DESKTOP HEADER -->
        <header class="desktop-header">

            <div class="os-brand">
                <span class="brand-icon">H</span>
                <span>HoussemOS</span>
                <span class="os-version">2.0</span>
            </div>

            <div class="desktop-status">
                <span class="status-indicator"></span>
                <span>System Online</span>
            </div>

        </header>

        <!-- DESKTOP SHORTCUTS -->
        <div id="desktop-icons">

            <button class="desktop-icon" data-app="about">
                <svg><use href="#icon-user"/></svg>
                <span>About Me</span>
            </button>

            <button class="desktop-icon" data-app="projects">
                <svg><use href="#icon-folder"/></svg>
                <span>My Projects</span>
            </button>

            <button class="desktop-icon" data-app="skills">
                <svg><use href="#icon-code"/></svg>
                <span>Technical Skills</span>
            </button>

            <button class="desktop-icon" data-app="experience">
                <svg><use href="#icon-briefcase"/></svg>
                <span>Experience</span>
            </button>

            <button class="desktop-icon" data-app="startup">
                <svg><use href="#icon-rocket"/></svg>
                <span>El Moultaqa</span>
            </button>

            <button class="desktop-icon" data-app="education">
                <svg><use href="#icon-graduation"/></svg>
                <span>Education</span>
            </button>

            <button class="desktop-icon" data-app="certifications">
                <svg><use href="#icon-medal"/></svg>
                <span>Certifications</span>
            </button>

            <button class="desktop-icon" data-app="terminal">
                <svg><use href="#icon-terminal"/></svg>
                <span>Terminal</span>
            </button>

            <button class="desktop-icon" data-app="contact">
                <svg><use href="#icon-mail"/></svg>
                <span>Contact</span>
            </button>

        </div>

        <!-- WINDOWS -->
        <div id="window-container"></div>

        <!-- START MENU -->
        <div id="start-menu" class="start-menu hidden">

            <div class="start-menu-header">

                <div class="user-avatar">H</div>

                <div>
                    <strong>Houssem Eddine</strong>
                    <small>Portfolio Workspace</small>
                </div>

            </div>

            <div class="start-menu-search">

                <svg><use href="#icon-search"/></svg>

                <input
                    type="text"
                    id="app-search"
                    placeholder="Search applications..."
                >

            </div>

            <div class="start-menu-section">

                <div class="section-heading">
                    <span>Applications</span>
                    <span>All apps</span>
                </div>

                <div class="start-apps">

                    <button data-app="about">
                        <svg><use href="#icon-user"/></svg>
                        About Me
                    </button>

                    <button data-app="projects">
                        <svg><use href="#icon-folder"/></svg>
                        Projects
                    </button>

                    <button data-app="skills">
                        <svg><use href="#icon-code"/></svg>
                        Skills
                    </button>

                    <button data-app="experience">
                        <svg><use href="#icon-briefcase"/></svg>
                        Experience
                    </button>

                    <button data-app="startup">
                        <svg><use href="#icon-rocket"/></svg>
                        El Moultaqa
                    </button>

                    <button data-app="education">
                        <svg><use href="#icon-graduation"/></svg>
                        Education
                    </button>

                    <button data-app="certifications">
                        <svg><use href="#icon-medal"/></svg>
                        Certificates
                    </button>

                    <button data-app="terminal">
                        <svg><use href="#icon-terminal"/></svg>
                        Terminal
                    </button>

                    <button data-app="contact">
                        <svg><use href="#icon-mail"/></svg>
                        Contact
                    </button>

                </div>

            </div>

            <div class="start-menu-footer">
                <span>HoussemOS 2.0</span>
                <span>Designed by Houssem</span>
            </div>

        </div>

    </section>

    <!-- TASKBAR -->
    <footer id="taskbar">

        <div class="taskbar-left">

            <button id="start-button"
                    class="taskbar-button start-button"
                    aria-label="Open Start Menu"
                    title="Start">

                <span class="start-logo">H</span>

            </button>

        </div>

        <div class="taskbar-center">

            <button class="taskbar-button pinned-app"
                    data-app="about"
                    title="About Me">
                <svg><use href="#icon-user"/></svg>
            </button>

            <button class="taskbar-button pinned-app"
                    data-app="projects"
                    title="Projects">
                <svg><use href="#icon-folder"/></svg>
            </button>

            <button class="taskbar-button pinned-app"
                    data-app="terminal"
                    title="Terminal">
                <svg><use href="#icon-terminal"/></svg>
            </button>

            <div id="taskbar-apps"></div>

        </div>

        <div class="taskbar-right">

            <button class="tray-button"
                    id="quick-settings-button"
                    title="Quick Settings">

                <svg><use href="#icon-wifi"/></svg>
                <svg><use href="#icon-volume"/></svg>

            </button>

            <button class="tray-button notification-button"
                    id="notification-button"
                    title="Notifications">

                <svg><use href="#icon-bell"/></svg>

            </button>

            <button class="clock-button" id="calendar-button">

                <span id="clock">00:00</span>
                <span id="date">Loading...</span>

            </button>

            <button id="show-desktop"
                    class="show-desktop"
                    title="Show Desktop">

            </button>

        </div>

    </footer>

    <!-- QUICK SETTINGS -->
    <div id="quick-settings" class="system-panel hidden">

        <div class="panel-heading">
            <strong>Quick Settings</strong>
            <span>HoussemOS</span>
        </div>

        <div class="quick-grid">

            <button class="quick-tile active" id="wifi-toggle">
                <svg><use href="#icon-wifi"/></svg>
                <span>Wi-Fi</span>
                <small id="wifi-status">On</small>
            </button>

            <button class="quick-tile active" id="volume-toggle">
                <svg><use href="#icon-volume"/></svg>
                <span>Sound</span>
                <small id="volume-status">On</small>
            </button>

            <button class="quick-tile active" id="theme-toggle">
                <svg><use href="#icon-sun"/></svg>
                <span>Appearance</span>
                <small id="theme-status">Frost</small>
            </button>

            <button class="quick-tile" id="fullscreen-toggle">
                <svg><use href="#icon-monitor"/></svg>
                <span>Display</span>
                <small>Fullscreen</small>
            </button>

        </div>

        <div class="panel-footer">
            <span>System controls</span>
            <span>HoussemOS 2.0</span>
        </div>

    </div>

    <!-- CALENDAR -->
    <div id="calendar-panel"
         class="system-panel calendar-panel hidden">

        <div class="calendar-clock" id="calendar-clock">00:00</div>

        <div class="calendar-full-date" id="calendar-full-date">
            Loading date...
        </div>

        <div id="calendar-content"></div>

    </div>

    <!-- NOTIFICATIONS -->
    <div id="notification-panel"
         class="system-panel notification-panel hidden">

        <div class="panel-heading">
            <strong>Notifications</strong>
            <button id="clear-notifications">Clear all</button>
        </div>

        <div id="notification-content">

            <div class="empty-notifications">

                <svg><use href="#icon-bell"/></svg>

                <strong>You're all caught up</strong>

                <span>No new notifications</span>

            </div>

        </div>

    </div>

</main>

</body>
</html>
